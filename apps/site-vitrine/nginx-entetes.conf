# En-têtes de sécurité du site vitrine — inclus dans le bloc `server` ET dans chaque
# `location` qui pose son propre `add_header`. Piège nginx : dès qu'une location déclare un
# `add_header`, elle n'hérite plus d'AUCUN `add_header` du niveau supérieur ; sans cet
# include, les pages (qui posent Cache-Control) partiraient sans en-têtes de sécurité.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Tout est servi depuis la même origine : police, images, vidéo, script, feuille de style.
# Les blocs JSON-LD (`type="application/ld+json"`) ne sont pas exécutés : la CSP ne les
# concerne pas. Aucun style ni script en ligne dans les pages.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
