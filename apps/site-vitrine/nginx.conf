server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Le référencement dépend d'un rendu rapide : compression et cache explicites.
  gzip on;
  gzip_types text/css application/javascript application/xml image/svg+xml text/plain;
  gzip_min_length 512;

  # La page peut changer à chaque déploiement ; ses ressources portent le même nom, donc
  # on les révalide plutôt que de les figer — un site vitrine n'a pas d'empreinte de build.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; }
  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

  # Rien d'exécutable n'est servi ici : on le dit au navigateur.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location / { try_files $uri $uri/ /index.html; }
}
