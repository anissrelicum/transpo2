server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Le référencement dépend d'un rendu rapide : compression et cache explicites.
  gzip on;
  gzip_types text/css application/javascript application/xml image/svg+xml text/plain;
  gzip_min_length 512;

  # La page peut changer à chaque déploiement ; ses ressources portent le même nom, donc
  # on les révalide plutôt que de les figer — un site vitrine n'a pas d'empreinte de build.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; }
  # Les captures portent un nom stable et changent rarement : on les met en cache un jour,
  # pas un an — un déploiement doit pouvoir les remplacer sans purge.
  location /img/ { add_header Cache-Control "public, max-age=86400"; }
  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

  # Rien d'exécutable n'est servi ici : on le dit au navigateur.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Le formulaire de démonstration est RELAYÉ vers l'API, au lieu d'être appelé
  # directement par le navigateur. Deux raisons : le site et l'API vivent sur deux
  # domaines, et ouvrir CORS sur l'API l'exposerait aux navigateurs du monde entier pour
  # un seul formulaire. Ici, le navigateur ne connaît qu'une adresse de même origine.
  location = /api/demande {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://transpo-api.transpo.svc.cluster.local:3000/v1/public/demo-request;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
  }

  location / { try_files $uri $uri/ /index.html; }
}
