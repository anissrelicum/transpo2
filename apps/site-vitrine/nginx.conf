# Site vitrine Portrail — fichiers statiques servis par nginx (inclus dans le bloc `http`).

# Le domaine de production n'est pas arrêté (transpo.wedowonders.com aujourd'hui,
# getportrail.com demain). Les pages, le sitemap et robots.txt portent donc le jeton
# __SITE__ partout où une URL absolue est exigée (canonique, hreflang, Open Graph, JSON-LD,
# sitemap), et nginx le remplace à la volée par l'origine qui sert la requête.
#
# Le site est derrière un ingress qui termine TLS : `$scheme` vaut alors « http ». On
# préfère le protocole annoncé par le relais (X-Forwarded-Proto), sinon `$scheme`.
map $http_x_forwarded_proto $portrail_scheme {
  default  $scheme;
  ~^https  https;
  ~^http   http;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Redirections relatives (« /en » → « /en/ ») : sans quoi nginx écrirait son propre
  # nom d'hôte et son port interne derrière l'ingress.
  absolute_redirect off;

  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

  # Le référencement dépend d'un rendu rapide : compression et cache explicites.
  # La substitution (sub_filter) passe AVANT la compression gzip dans la chaîne de filtres :
  # les fichiers statiques sont donc réécrits puis compressés. Ne pas activer gzip_static,
  # dont les .gz précompressés court-circuiteraient la substitution.
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml
             application/manifest+json image/svg+xml;

  # __SITE__ → « https://hôte-qui-sert ». text/html est toujours inclus par nginx.
  # nginx sert .xml en text/xml : on le liste avec application/xml.
  sub_filter '__SITE__' '$portrail_scheme://$host';
  sub_filter_once off;
  sub_filter_types text/xml application/xml text/plain application/json application/manifest+json;

  include /etc/nginx/snippets/portrail-entetes.conf;

  # ------------------------------------------------------------------ pages ---
  # Une page peut changer à chaque déploiement : toujours revalidée.
  location ~* \.html$ {
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "no-cache";
  }
  # Feuille de style et script portent un nom stable (pas d'empreinte de build) :
  # révalidés aussi, sinon un déploiement servirait une page neuve avec un CSS ancien.
  location ~* \.(?:css|js)$ {
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "no-cache";
  }

  # ---------------------------------------------------------------- ressources ---
  # La police ne change jamais sous ce nom : un an, immuable.
  location /fonts/ {
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
  }
  # Images et vidéo : cache long (30 jours) mais pas « immutable » — un visuel peut être
  # remplacé sous le même nom (le logo l'a été). La vidéo MP4 est servie avec les requêtes
  # partielles (Range, 206) nativement par nginx : lecture et avance rapide sans tout
  # télécharger.
  location /medias/ {
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "public, max-age=2592000";
  }
  location ~* ^/(?:favicon\.svg|apple-touch-icon\.png)$ {
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "public, max-age=604800";
  }
  location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "public, max-age=86400";
  }
  location = /robots.txt {
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /sitemap.xml {
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "public, max-age=3600";
  }

  # --------------------------------------------------------------- relais API ---
  # Le formulaire de démonstration est RELAYÉ vers l'API, au lieu d'être appelé
  # directement par le navigateur. Deux raisons : le site et l'API vivent sur deux
  # domaines, et ouvrir CORS sur l'API l'exposerait aux navigateurs du monde entier pour
  # un seul formulaire. Ici, le navigateur ne connaît qu'une adresse de même origine.
  location = /api/demande {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://transpo-api.transpo.svc.cluster.local:3000/v1/public/demo-request;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Réponse non compressée par l'API : sub_filter (actif sur application/json) ne sait
    # pas lire un corps gzip. La compression vers le navigateur reste faite par nginx.
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
  }

  # ----------------------------------------------------------------- routage ---
  location = /en { return 301 /en/; }

  # Site statique : une adresse inconnue est une vraie 404 (et non la page d'accueil
  # servie en 200, qu'un moteur de recherche indexerait en double).
  location / { try_files $uri $uri/ =404; }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/portrail-entetes.conf;
    add_header Cache-Control "no-cache";
  }
}
